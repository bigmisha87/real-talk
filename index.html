<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Real Talk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Lora:ital,wght@1,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg1: #0d0518;
      --bg2: #1b0830;
      --rose: #e04f78;
      --rose-dark: #b83560;
      --rose-glow: rgba(224, 79, 120, 0.35);
      --gold: #c8896a;
      --card-bg: #fff9f5;
      --card-bg2: #ffeee6;
      --card-text: #1c0a18;
      --card-en: #5b3a46;
    }

    html, body {
      height: 100%; height: 100dvh;
      overflow: hidden;
    }

    body {
      background: linear-gradient(155deg, var(--bg1) 0%, var(--bg2) 55%, #1a0530 100%);
      font-family: 'Heebo', -apple-system, 'Segoe UI', Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button { font-family: inherit; }

    /* ─── HEADER ─── */
    .header {
      width: 100%;
      padding: 16px 20px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .title {
      font-size: clamp(19px, 5.6vw, 26px);
      font-weight: 800;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #fff 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Language switch */
    .lang-switch {
      display: flex;
      gap: 2px;
      padding: 3px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .lang-switch button {
      border: none;
      background: none;
      color: rgba(255,255,255,0.72);
      font-size: 13px;
      font-weight: 600;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 16px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .lang-switch button.active {
      background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
      color: #fff;
    }

    /* ─── CARD AREA ─── */
    .card-area {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 20px 14px;
    }

    /* Card stage — holds the deck + the active card. Its size follows the free height,
       so the card grows on big screens and shrinks on small phones. */
    .card-stage {
      position: relative;
      height: 100%;
      max-height: 700px;
      min-height: 260px;
      aspect-ratio: 3 / 4;
      max-width: 100%;
      flex-shrink: 0;
      perspective: 1000px;
      touch-action: pan-y;
      cursor: grab;
    }

    .card-stage:active { cursor: grabbing; }

    /* Deck (the stack of card backs behind the active card) */
    .deck {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .deck-card {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background:
        repeating-linear-gradient(45deg, rgba(200,137,106,0.20) 0 2px, transparent 2px 15px),
        repeating-linear-gradient(-45deg, rgba(200,137,106,0.20) 0 2px, transparent 2px 15px),
        linear-gradient(145deg, #5f1f4a 0%, #2f0f3d 100%);
      border: 1.5px solid rgba(200,137,106,0.6);
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s;
    }

    .deck-card::after {
      content: '';
      position: absolute;
      inset: 9px;
      border-radius: 13px;
      border: 1px solid rgba(200,137,106,0.4);
    }

    .deck-card:nth-child(1) { transform: translate(11px, 11px) rotate(4deg); }
    .deck-card:nth-child(2) { transform: translate(-8px, 8px) rotate(-3deg); }
    .deck-card:nth-child(3) { transform: translate(6px, 5px) rotate(2deg); }
    .deck-card:nth-child(4) { transform: translate(-3px, 3px) rotate(-1.2deg); }
    .deck-card:nth-child(5) { transform: translate(0, 0) rotate(0deg); }

    .deck-card.gone { opacity: 0; }

    .deck.shuffling .deck-card:nth-child(1) { transform: translate(-42px, -26px) rotate(-18deg); }
    .deck.shuffling .deck-card:nth-child(2) { transform: translate(40px, -14px) rotate(13deg); }
    .deck.shuffling .deck-card:nth-child(3) { transform: translate(-20px, 20px) rotate(-8deg); }
    .deck.shuffling .deck-card:nth-child(4) { transform: translate(24px, 16px) rotate(7deg); }
    .deck.shuffling .deck-card:nth-child(5) { transform: translate(-6px, 8px) rotate(-3deg); }

    /* Main card */
    .card {
      position: absolute;
      inset: 0;
      z-index: 1;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 20px;
    }

    .card.flip-out {
      transform: rotateY(90deg) scale(0.92);
    }
    .card.flip-in {
      transform: rotateY(0deg) scale(1);
    }
    .card.start-hidden {
      transform: rotateY(-90deg) scale(0.92);
    }

    /* Swiped away: flies off to the side it was dragged to (--fly is 1 or -1) */
    .card.swipe-out {
      transform: translateX(calc(var(--fly, 1) * 130%)) rotate(calc(var(--fly, 1) * 16deg));
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.4, 0, 1, 1), opacity 0.3s ease-in;
    }

    .card-face {
      --cat: var(--rose);
      --cat-ink: var(--rose-dark);
      --cat-soft: rgba(224, 79, 120, 0.14);
      --cat-glow: var(--rose-glow);
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: linear-gradient(160deg, var(--card-bg) 0%, var(--card-bg2) 100%);
      box-shadow: 0 16px 48px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08), 0 0 60px var(--cat-glow);
      display: flex;
      flex-direction: column;
      padding: 54px 26px 42px;
      transition: box-shadow 0.3s;
    }

    /* Category palettes — used by the card face and by the filter chips */
    [data-cat="all"]   { --cat: var(--rose); }
    [data-cat="light"] { --cat: #e8912d; --cat-ink: #94550a; --cat-soft: rgba(232,145,45,0.16); --cat-glow: rgba(232,145,45,0.38); }
    [data-cat="deep"]  { --cat: #6a74e0; --cat-ink: #3a44ae; --cat-soft: rgba(106,116,224,0.15); --cat-glow: rgba(106,116,224,0.40); }
    [data-cat="love"]  { --cat: #e04f78; --cat-ink: #b83560; --cat-soft: rgba(224,79,120,0.14);  --cat-glow: rgba(224,79,120,0.38); }
    [data-cat="spicy"] { --cat: #e5432b; --cat-ink: #ad2812; --cat-soft: rgba(229,67,43,0.14);   --cat-glow: rgba(229,67,43,0.42); }

    /* Card corner decoration */
    .card-face::before {
      content: '♥';
      position: absolute;
      top: 14px;
      right: 18px;
      font-size: 20px;
      color: var(--cat);
      opacity: 0.55;
    }

    .card-face::after {
      content: '♥';
      position: absolute;
      bottom: 14px;
      left: 18px;
      font-size: 20px;
      color: var(--cat);
      opacity: 0.55;
      transform: rotate(180deg);
    }

    .cat-badge {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 999px;
      background: var(--cat-soft);
      color: var(--cat-ink);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Wrapper that centers the text when it fits, and lets us detect when it doesn't */
    .qwrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .qinner {
      margin: auto 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .question-he {
      font-size: calc(clamp(22px, min(6.5vw, 4.2vh), 38px) * var(--fit, 1));
      font-weight: 700;
      color: var(--card-text);
      text-align: center;
      line-height: 1.45;
      direction: rtl;
    }

    .card-divider {
      width: 50px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cat), transparent);
      border-radius: 2px;
      flex-shrink: 0;
    }

    .question-en {
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      font-size: calc(clamp(16px, min(4.8vw, 2.7vh), 22px) * var(--fit, 1));
      font-weight: 500;
      color: var(--card-en);
      text-align: center;
      line-height: 1.45;
      direction: ltr;
      font-style: italic;
    }

    /* English-only mode: the English becomes the main text */
    .question-en.main {
      font-family: inherit;
      font-style: normal;
      font-weight: 700;
      color: var(--card-text);
      font-size: calc(clamp(22px, min(6.5vw, 4.2vh), 38px) * var(--fit, 1));
      line-height: 1.4;
    }

    /* Welcome state */
    .welcome-icon {
      font-size: 52px;
      line-height: 1;
    }

    .welcome-brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--card-text);
      direction: ltr;
    }

    .welcome-line {
      font-size: calc(clamp(18px, min(5.2vw, 3.4vh), 26px) * var(--fit, 1));
      font-weight: 700;
      color: var(--card-text);
      text-align: center;
      line-height: 1.4;
      direction: rtl;
    }

    .welcome-sub {
      font-size: calc(clamp(14px, min(4vw, 2.4vh), 18px) * var(--fit, 1));
      color: var(--card-en);
      text-align: center;
      line-height: 1.5;
      direction: rtl;
    }

    .welcome-en {
      direction: ltr;
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-weight: 500;
    }

    /* Done overlay */
    .done-overlay {
      display: none;
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: linear-gradient(160deg, #fff6f0 0%, #ffdce6 100%);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      padding: 28px;
      text-align: center;
    }

    .done-overlay.visible {
      display: flex;
    }

    .done-icon {
      font-size: 64px;
      line-height: 1;
    }

    .done-text {
      font-size: 28px;
      font-weight: 800;
      color: var(--card-text);
    }

    .done-sub {
      font-size: 16px;
      line-height: 1.5;
      color: var(--card-en);
    }

    .done-en {
      direction: ltr;
      font-family: 'Lora', Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-weight: 500;
    }

    .done-btn {
      margin-top: 10px;
      min-height: 46px;
      padding: 0 26px;
      border: none;
      border-radius: 23px;
      background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px var(--rose-glow);
    }

    .done-btn:active { transform: scale(0.97); }

    /* ─── CONTROLS ─── */
    .controls {
      width: min(92vw, 440px);
      padding: 6px 0 22px;
      padding-bottom: max(22px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Counter + reset */
    .status {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .counter-block {
      flex: 1;
      min-width: 0;
    }

    .counter {
      font-size: 15px;
      color: rgba(255,255,255,0.75);
      white-space: nowrap;
    }

    .counter b {
      color: var(--rose);
      font-weight: 800;
      font-size: 22px;
    }

    .progress {
      height: 6px;
      margin-top: 6px;
      border-radius: 6px;
      background: rgba(255,255,255,0.12);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--rose), var(--gold));
      transition: width 0.4s ease;
    }

    .reset-btn {
      flex-shrink: 0;
      min-height: 44px;
      padding: 0 16px;
      background: none;
      border: 1px solid rgba(255,255,255,0.3);
      color: rgba(255,255,255,0.8);
      font-size: 14px;
      font-weight: 500;
      border-radius: 22px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .reset-btn:hover { color: #fff; border-color: rgba(255,255,255,0.55); background: rgba(255,255,255,0.06); }

    /* Category chips */
    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
    }

    .chip {
      min-height: 38px;
      padding: 0 8px;
      border-radius: 19px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.82);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .chip.active {
      background: var(--cat);
      border-color: var(--cat);
      color: #fff;
    }

    /* Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 44px;
      direction: rtl;
      cursor: pointer;
    }

    .toggle-wrap {
      position: relative;
      width: 52px;
      height: 30px;
      flex-shrink: 0;
    }

    .toggle-wrap input {
      opacity: 0;
      width: 0; height: 0;
      position: absolute;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 30px;
      background: rgba(255,255,255,0.2);
      transition: background 0.25s;
    }

    .toggle-wrap input:checked ~ .toggle-track {
      background: var(--rose);
    }

    .toggle-thumb {
      position: absolute;
      top: 3px; left: 3px;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 0.25s;
    }

    .toggle-wrap input:checked ~ .toggle-track ~ .toggle-thumb,
    .toggle-wrap input:checked + .toggle-track + .toggle-thumb {
      transform: translateX(22px);
    }

    .toggle-label-text {
      font-size: 15px;
      color: rgba(255,255,255,0.85);
    }

    /* Shuffle button */
    .shuffle-btn {
      width: 100%;
      height: 58px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 8px 24px var(--rose-glow), 0 2px 0 rgba(255,255,255,0.15) inset;
      transition: transform 0.12s, box-shadow 0.12s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    .shuffle-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.4s;
    }

    .shuffle-btn:not(:disabled):hover::before { left: 100%; }
    .shuffle-btn:not(:disabled):active { transform: scale(0.97); box-shadow: 0 4px 12px var(--rose-glow); }
    .shuffle-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .shuffle-icon {
      font-size: 22px;
      transition: transform 0.6s;
    }

    .shuffle-btn.spinning .shuffle-icon {
      animation: spin-icon 0.6s ease-in-out;
    }

    @keyframes spin-icon {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.3); }
      100% { transform: rotate(360deg) scale(1); }
    }

    /* Short phones: tighten the controls so the card keeps its room */
    @media (max-height: 740px) {
      .header { padding-top: 10px; }
      .controls { gap: 6px; padding-bottom: 14px; }
      .toggle-row { min-height: 36px; }
      .shuffle-btn { height: 52px; }
      .chip { min-height: 34px; }
      .reset-btn { min-height: 38px; }
    }

    /* ─── ANIMATIONS ─── */
    @keyframes card-pop-in {
      0% { transform: scale(0.85) translateY(30px); opacity: 0; }
      60% { transform: scale(1.03) translateY(-4px); }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .card.pop-in {
      animation: card-pop-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Particles */
    .particles {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      opacity: 0;
    }

    @keyframes particle-burst {
      0% { transform: translate(0,0) scale(1); opacity: 0.9; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="header">
  <div class="title">Real Talk</div>
  <div class="lang-switch" id="lang-switch" role="group" aria-label="שפת הקלפים">
    <button type="button" data-lang="he" aria-pressed="false">עברית</button>
    <button type="button" data-lang="both" aria-pressed="true" class="active">שתיהן</button>
    <button type="button" data-lang="en" aria-pressed="false">אנגלית</button>
  </div>
</div>

<div class="card-area">
  <div class="card-stage" id="stage">
    <div class="deck" id="deck">
      <div class="deck-card"></div>
      <div class="deck-card"></div>
      <div class="deck-card"></div>
      <div class="deck-card"></div>
      <div class="deck-card"></div>
    </div>
    <div class="card" id="card">
      <div class="card-face" id="card-face"></div>
      <div class="done-overlay" id="done-overlay"></div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="status">
    <div class="counter-block">
      <div class="counter" id="counter">—</div>
      <div class="progress" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <button class="reset-btn" id="reset-btn" type="button">↺ איפוס קלפים</button>
  </div>

  <div class="chips" id="chips" role="group" aria-label="קטגוריות">
    <button type="button" class="chip active" data-cat="all" aria-pressed="true">הכל</button>
    <button type="button" class="chip" data-cat="light" aria-pressed="false">😄 קליל</button>
    <button type="button" class="chip" data-cat="deep" aria-pressed="false">💭 עמוק</button>
    <button type="button" class="chip" data-cat="love" aria-pressed="false">💞 רומנטי</button>
    <button type="button" class="chip" data-cat="spicy" aria-pressed="false">🔥 נועז</button>
  </div>

  <label class="toggle-row">
    <div class="toggle-wrap">
      <input type="checkbox" id="dont-repeat" checked>
      <div class="toggle-track"></div>
      <div class="toggle-thumb"></div>
    </div>
    <span class="toggle-label-text">לא לחזור על קלפים שכבר הוצגו</span>
  </label>

  <button class="shuffle-btn" id="shuffle-btn">
    <span class="shuffle-icon">🔀</span>
    <span>SHUFFLE</span>
  </button>
</div>

<script>
const QUESTIONS = [
  { he: "מה ההרפתקאה הבאה שלך?", en: "What is your next great adventure?", cat: "light" },
  { he: "למה את/ה אסיר/ת תודה ברגע זה?", en: "What are you thankful for this very moment?", cat: "deep" },
  { he: "מה גורם לך להרגיש חי/ה?", en: "What makes you feel really alive?", cat: "deep" },
  { he: "איזו תכונה מוזרה יש למשפחה שלך?", en: "What is a quirk your family has?", cat: "light" },
  { he: "למה את/ה מתגעגע/ת?", en: "What do you miss?", cat: "deep" },
  { he: "איפה היית רוצה/ת להתעורר מחר?", en: "Where would you like to wake up tomorrow?", cat: "light" },
  { he: "למה את/ה הכי מצפה?", en: "What are you looking forward to?", cat: "light" },
  { he: "איזה חפץ היית מציל/ה אם הבית היה עולה באש?", en: "What object would you save if your house was on fire?", cat: "deep" },
  { he: "האם היית רוצה/ת שהילדים שלך יהיו כמוך?", en: "Do you want your children (if you have any) to be like you?", cat: "deep" },

  { he: "אם יום אחד הילד/ה שלך היה חי את החיים שאת/ה חי/ה היום, מה היית מייעץ/ת לו/ה לשנות?", en: "If one day your child were living the life you're living now, what would you advise them to change?", cat: "deep" },
  { he: "האם הרגשת פעם שאת/ה מתגעגע/ת לעצמך? לאדם שהיית לפני שהחיים שינו הכול?", en: "Have you ever had the feeling that you miss yourself? The person you were before life changed everything?", cat: "deep" }
];

// ─── CATEGORIES ──────────────────────────────
// Every question has a `cat` key from this list. "All" is not a category — it is
// simply "no filter" (nothing selected).
const CATS = {
  light: { emoji: '😄', he: 'קליל',   en: 'Light' },
  deep:  { emoji: '💭', he: 'עמוק',   en: 'Deep' },
  love:  { emoji: '💞', he: 'רומנטי', en: 'Romantic' },
  spicy: { emoji: '🔥', he: 'נועז',   en: 'Spicy' }
};
const CAT_KEYS = Object.keys(CATS);

// ─── STATE ───────────────────────────────────
const STORAGE_KEY = 'bigtalk_shown_v1';
const CATS_KEY = 'bigtalk_cats_v1';
const LANG_KEY = 'bigtalk_lang_v1';

function loadShown() {
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')); }
  catch { return new Set(); }
}

function saveShown(set) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...set]));
}

function loadPref(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch { return fallback; }
}

function savePref(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

let shown = loadShown();
let activeCats = new Set([].concat(loadPref(CATS_KEY, [])).filter(k => CATS[k])); // empty = all
let lang = loadPref(LANG_KEY, 'both');          // 'he' | 'en' | 'both'
if (!['he', 'en', 'both'].includes(lang)) lang = 'both';
let view = { type: 'welcome' };                 // welcome | question | done
let isAnimating = false;

// ─── DOM ─────────────────────────────────────
const card = document.getElementById('card');
const cardFace = document.getElementById('card-face');
const doneOverlay = document.getElementById('done-overlay');
const stage = document.getElementById('stage');
const deck = document.getElementById('deck');
const deckCards = [...deck.children];
const shuffleBtn = document.getElementById('shuffle-btn');
const dontRepeat = document.getElementById('dont-repeat');
const resetBtn = document.getElementById('reset-btn');
const counterEl = document.getElementById('counter');
const progressFill = document.getElementById('progress-fill');
const chipsEl = document.getElementById('chips');
const langSwitch = document.getElementById('lang-switch');
const particles = document.getElementById('particles');

// ─── POOL + COUNTER ──────────────────────────
const inScope = q => activeCats.size === 0 || activeCats.has(q.cat);

function getPool() {
  const dontRepeatOn = dontRepeat.checked;
  return QUESTIONS
    .map((q, i) => ({ q, i }))
    .filter(({ q, i }) => inScope(q) && (!dontRepeatOn || !shown.has(i)));
}

function updateCounter() {
  const total = QUESTIONS.filter(inScope).length;
  const remaining = dontRepeat.checked ? getPool().length : total;

  counterEl.innerHTML = dontRepeat.checked
    ? `נשארו <b>${remaining}</b> מתוך ${total}`
    : `<b>${total}</b> קלפים בחפיסה`;

  const ratio = total ? remaining / total : 0;
  progressFill.style.width = (ratio * 100) + '%';

  // The visible stack of card backs gets thinner as the deck runs down
  const level = remaining === 0 ? 0 : Math.max(1, Math.ceil(ratio * deckCards.length));
  deckCards.forEach((el, i) => el.classList.toggle('gone', i < deckCards.length - level));
}

// ─── GET NEXT ────────────────────────────────
function getNext() {
  const pool = getPool();
  if (pool.length === 0) return null;

  const { q, i } = pool[Math.floor(Math.random() * pool.length)];

  if (dontRepeat.checked) {
    shown.add(i);
    saveShown(shown);
  }

  return { q, i };
}

// ─── RENDER ──────────────────────────────────
function questionHTML(q) {
  const he = `<p class="question-he">${q.he}</p>`;
  if (lang === 'he') return he;
  if (lang === 'en') return `<p class="question-en main">${q.en}</p>`;
  return `${he}<div class="card-divider"></div><p class="question-en">${q.en}</p>`;
}

function badgeHTML(q) {
  const c = CATS[q.cat];
  if (!c) return '';
  return `<div class="cat-badge"><span>${c.emoji}</span><span>${lang === 'en' ? c.en : c.he}</span></div>`;
}

function welcomeHTML() {
  const he = `
    <p class="welcome-line">עוברים תור, עונים בכנות</p>
    <p class="welcome-sub">לחצו על הכפתור או החליקו את הקלף כדי להתחיל</p>`;
  const en = `
    <p class="welcome-line welcome-en">Take turns, answer honestly</p>
    <p class="welcome-sub welcome-en">Press the button or swipe the card to begin</p>`;
  const body = lang === 'he' ? he : lang === 'en' ? en : `${he}<div class="card-divider"></div>${en}`;
  return `<div class="welcome-icon">🃏</div><div class="welcome-brand">Real Talk</div>${body}`;
}

function doneHTML() {
  // Cards left in other categories? Then the person only needs to pick another one.
  const othersLeft = activeCats.size > 0 && QUESTIONS.some((q, i) => !inScope(q) && !shown.has(i));
  const he = `
    <div class="done-text">כל הכבוד!</div>
    <div class="done-sub">${othersLeft ? 'סיימתם את כל הקלפים בקטגוריות שבחרתם.<br>אפשר לבחור קטגוריה נוספת, או להתחיל מחדש.' : 'סיימתם את כל הקלפים'}</div>`;
  const en = `
    <div class="done-text done-en">Well done!</div>
    <div class="done-sub done-en">${othersLeft ? 'You finished every card in your chosen categories.<br>Pick another category, or start over.' : 'You went through every card'}</div>`;
  const body = lang === 'he' ? he : lang === 'en' ? en : `${he}${en}`;
  const btn = lang === 'en' ? 'Start over' : 'מתחילים מחדש';
  return `<div class="done-icon">🎉</div>${body}<button type="button" class="done-btn">${btn}</button>`;
}

// Long questions on small cards: shrink the text step by step until it fits.
function fitText() {
  cardFace.style.setProperty('--fit', 1);
  const wrap = cardFace.querySelector('.qwrap');
  if (!wrap) return;
  let fit = 1;
  while (wrap.scrollHeight > wrap.clientHeight + 1 && fit > 0.55) {
    fit = Math.round((fit - 0.05) * 100) / 100;
    cardFace.style.setProperty('--fit', fit);
  }
}

function render() {
  doneOverlay.classList.toggle('visible', view.type === 'done');

  if (view.type === 'question') {
    cardFace.dataset.cat = view.q.cat || '';
    cardFace.innerHTML = `${badgeHTML(view.q)}<div class="qwrap"><div class="qinner">${questionHTML(view.q)}</div></div>`;
  } else if (view.type === 'welcome') {
    delete cardFace.dataset.cat;
    cardFace.innerHTML = `<div class="qwrap"><div class="qinner">${welcomeHTML()}</div></div>`;
  } else {
    delete cardFace.dataset.cat;
    cardFace.innerHTML = '';
    doneOverlay.innerHTML = doneHTML();
  }
  fitText();
}

// ─── PARTICLES ───────────────────────────────
const PARTICLE_COLORS = ['#e04f78', '#c8896a', '#f4a3be', '#ffd700', '#ff6b9d'];

function burst() {
  const rect = shuffleBtn.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  for (let k = 0; k < 12; k++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (k / 12) * 2 * Math.PI;
    const dist = 60 + Math.random() * 80;
    const dx = Math.cos(angle) * dist + 'px';
    const dy = Math.sin(angle) * dist + 'px';
    p.style.cssText = `
      left:${cx}px; top:${cy}px;
      background:${PARTICLE_COLORS[k % PARTICLE_COLORS.length]};
      --dx:${dx}; --dy:${dy};
      animation: particle-burst 0.6s ease-out ${k * 0.03}s forwards;
    `;
    particles.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }
}

// Bigger, slower burst from the middle of the card when the deck runs out
function confetti() {
  const rect = stage.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  for (let k = 0; k < 44; k++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = Math.random() * 2 * Math.PI;
    const dist = 110 + Math.random() * 190;
    const size = 6 + Math.random() * 6;
    p.style.cssText = `
      left:${cx}px; top:${cy}px;
      width:${size}px; height:${size}px;
      border-radius:${Math.random() < 0.5 ? '50%' : '2px'};
      background:${PARTICLE_COLORS[k % PARTICLE_COLORS.length]};
      --dx:${Math.cos(angle) * dist}px; --dy:${Math.sin(angle) * dist}px;
      animation: particle-burst 1s ease-out ${Math.random() * 0.15}s forwards;
    `;
    particles.appendChild(p);
    setTimeout(() => p.remove(), 1300);
  }
}

function haptic() {
  try { if (navigator.vibrate) navigator.vibrate(12); } catch {}
}

// ─── NEXT CARD (button = flip, swipe = fly off) ─
function advance(dir) {
  if (isAnimating) return;
  isAnimating = true;
  shuffleBtn.disabled = true;
  shuffleBtn.classList.add('spinning');

  burst();
  haptic();
  deck.classList.add('shuffling');

  // Phase 1: current card leaves
  if (dir) {
    card.style.setProperty('--fly', dir);
    card.classList.add('swipe-out');
  } else {
    card.classList.add('flip-out');
  }

  setTimeout(() => {
    const result = getNext();
    view = result ? { type: 'question', q: result.q } : { type: 'done' };

    // Jump the card to its hidden start position without animating, swap the text,
    // then flip the new card in.
    card.style.transition = 'none';
    card.classList.remove('flip-out', 'swipe-out');
    card.classList.add('start-hidden');
    render();
    void card.offsetWidth;
    card.style.transition = '';
    card.classList.remove('start-hidden');
    card.classList.add('flip-in');

    updateCounter();
    deck.classList.remove('shuffling');
    if (view.type === 'done') confetti();

    setTimeout(() => {
      card.classList.remove('flip-in');
      card.style.removeProperty('--fly');
      shuffleBtn.classList.remove('spinning');
      shuffleBtn.disabled = false;
      isAnimating = false;
    }, 560);
  }, dir ? 300 : 280);
}

// ─── SWIPE ───────────────────────────────────
let drag = null;

stage.addEventListener('pointerdown', e => {
  if (isAnimating || e.target.closest('button')) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, locked: false };
});

stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;

  if (!drag.locked) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    if (Math.abs(dy) > Math.abs(dx)) { drag = null; return; }   // vertical: leave it to the browser
    drag.locked = true;
    try { stage.setPointerCapture(e.pointerId); } catch {}
    card.style.transition = 'none';
  }

  drag.dx = dx;
  card.style.transform = `translateX(${dx}px) rotate(${dx * 0.05}deg)`;
});

function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const { dx, locked } = drag;
  drag = null;
  if (!locked) return;

  card.style.transition = '';
  card.style.transform = '';
  const threshold = Math.min(90, stage.clientWidth * 0.25);
  if (e.type === 'pointerup' && Math.abs(dx) > threshold) advance(dx > 0 ? 1 : -1);
}

stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

// ─── RESET ───────────────────────────────────
function doReset() {
  if (isAnimating) return;
  shown.clear();
  saveShown(shown);
  view = { type: 'welcome' };
  render();
  updateCounter();
}

// ─── TOGGLE ──────────────────────────────────
dontRepeat.addEventListener('change', () => {
  if (!dontRepeat.checked) {
    // Unchecking - clear memory so counter is right
    shown.clear();
    saveShown(shown);
  }
  onScopeChange();
});

// ─── CATEGORIES (chips) ──────────────────────
function syncChips() {
  chipsEl.querySelectorAll('.chip').forEach(chip => {
    const key = chip.dataset.cat;
    const on = key === 'all' ? activeCats.size === 0 : activeCats.has(key);
    chip.classList.toggle('active', on);
    chip.setAttribute('aria-pressed', on);
  });
}

// The pool changed (category or toggle). If we were on the "finished" screen and
// there are cards again, go back to the start screen; otherwise leave the card alone.
function onScopeChange() {
  if (view.type === 'done') {
    view = getPool().length ? { type: 'welcome' } : { type: 'done' };
    render();
  }
  updateCounter();
}

chipsEl.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const key = chip.dataset.cat;

  if (key === 'all') {
    activeCats.clear();
  } else {
    if (activeCats.has(key)) activeCats.delete(key); else activeCats.add(key);
    if (activeCats.size === CAT_KEYS.length) activeCats.clear();   // every category = all
  }

  savePref(CATS_KEY, [...activeCats]);
  syncChips();
  onScopeChange();
});

// ─── LANGUAGE ────────────────────────────────
function syncLang() {
  langSwitch.querySelectorAll('button').forEach(btn => {
    const on = btn.dataset.lang === lang;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', on);
  });
}

langSwitch.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  lang = btn.dataset.lang;
  savePref(LANG_KEY, lang);
  syncLang();
  render();
});

// ─── EVENTS ──────────────────────────────────
shuffleBtn.addEventListener('click', () => advance(0));
resetBtn.addEventListener('click', doReset);
doneOverlay.addEventListener('click', e => {
  if (e.target.closest('.done-btn')) doReset();
});
window.addEventListener('resize', fitText);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitText);

// ─── INIT ────────────────────────────────────
syncChips();
syncLang();
render();
updateCounter();
</script>
</body>
</html>
